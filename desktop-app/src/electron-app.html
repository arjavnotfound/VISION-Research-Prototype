<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<!-- TODO: tighten CSP if possible; it seems WASM requires 'unsafe-eval' in Chrome... https://issues.chromium.org/issues/41457889 -->
	<!-- I worked hard to avoid 'unsafe-eval', I invented a whole tool for it (see eval-is-evil.html), so this is a bit of a bummer. -->
	<!-- Looks like in Electron there's 'wasm-eval' behind flag enableBlinkFeatures: 'WebAssemblyCSP'... -->
	<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' blob:">
	<title>V.I.S.I.O.N. — Research Prototype (Event Expo 67)</title>
	<script src="../node_modules/vision-hft/lib/stats.js"></script>
	<script src="../node_modules/vision-hft/lib/no-eval.js"></script>
	<script src="../node_modules/vision-hft/lib/clmtrackr.js"></script>
	<script src="../node_modules/vision-hft/lib/face_mesh/face_mesh.js"></script>
	<script src="../node_modules/vision-hft/lib/face-landmarks-detection.min.js"></script>
	<script src="../node_modules/vision-hft/lib/OneEuroFilter.js"></script>
	<!-- <script src="../node_modules/vision-hft/lib/jsfeat-min.js"></script> exported from patched clmtrackr.js -->
	<style>
		:root {
			--bg-app: #0d1117;
			--bg-surface: #161b22;
			--border-color: #30363d;
			--text-primary: #e6edf3;
			--text-secondary: #8b949e;
			--accent-blue: #58a6ff;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color: var(--bg-app);
			color: var(--text-primary);
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			user-select: none;
		}

		body {
			display: flex;
			flex-direction: column;
		}

		.app-titlebar {
			-webkit-app-region: drag;
			height: env(titlebar-area-height, 36px);
			min-height: 36px;
			overflow: hidden;
			background-color: var(--bg-surface);
			border-bottom: 1px solid var(--border-color);
			flex-shrink: 0;
			display: flex;
			flex-direction: row;
			align-items: center;
			padding: 0 12px;
			gap: 8px;
		}

		.app-titlebar-brand {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.app-titlebar-acronym {
			font-size: 13px;
			font-weight: 700;
			letter-spacing: 0.08em;
			color: var(--accent-blue);
			font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
		}

		.app-titlebar-badge {
			font-size: 9px;
			font-weight: 600;
			letter-spacing: 0.06em;
			text-transform: uppercase;
			background-color: rgba(88, 166, 255, 0.12);
			color: #79c0ff;
			border: 1px solid rgba(88, 166, 255, 0.3);
			border-radius: 2px;
			padding: 1px 5px;
		}

		.app-titlebar-expo {
			font-size: 9px;
			font-weight: 600;
			letter-spacing: 0.06em;
			text-transform: uppercase;
			color: var(--text-secondary);
			border: 1px solid var(--border-color);
			background-color: rgba(255, 255, 255, 0.03);
			border-radius: 2px;
			padding: 1px 5px;
		}

		.app-titlebar-status-dot {
			width: 6px;
			height: 6px;
			border-radius: 50%;
			background-color: #3fb950;
			margin-left: 4px;
		}

		.vision-ui {
			flex: 1;
			min-height: 0;
			overflow: hidden;
		}
	</style>
	<link rel="stylesheet" type="text/css" href="custom-menu-bar.css">
	<link rel="stylesheet" type="text/css" href="../node_modules/vision-hft/vision.css">
	<link rel="icon" type="image/png" sizes="16x16" href="images/vision-logo-16.png">
	<link rel="icon" type="image/png" sizes="512x512" href="images/vision-logo-512.png">
</head>

<body>
	<div class="app-titlebar">
		<div class="app-titlebar-brand">
			<span class="app-titlebar-acronym">V.I.S.I.O.N.</span>
			<span class="app-titlebar-badge">Research Prototype</span>
			<span class="app-titlebar-expo">Event Expo 67</span>
			<span class="app-titlebar-status-dot" id="system-status-indicator" title="System Operational"></span>
		</div>
	</div>
	<div id="custom-menu-bar"></div>
	<script src="../node_modules/vision-hft/vision.js"></script>
	<script src="../node_modules/os-gui/MenuBar.js"></script>
	<script src="custom-menu-bar.js"></script>
	<script>
		(async () => {
			initCustomMenuBar();

			// Load options before initializing UI and put in localStorage
			// because currently the translation loading uses localStorage only
			let opts;
			try {
				opts = await window.electronAPI.getOptions();
			} catch (error) {
				console.error("Error getting options from main process:", error);
			}
			try {
				localStorage.setItem("vision-settings", JSON.stringify(opts));
			} catch (error) {
				console.error("Error saving options to localStorage:", error);
			}
			// -------

			Vision.dependenciesRoot = "../node_modules/vision-hft";
			Vision.init();
		})();
	</script>
</body>

</html>
